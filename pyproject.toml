[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explore-vtla"
version = "1.0.0"
description = "Reality-coupled loss routing for vision-tactile-language-action learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Bryce Lovell" }]
dependencies = ["torch>=2.1.0", "numpy>=1.24.0"]

[project.scripts]
explore-vtla = "explore_vtla.cli:main"

[tool.setuptools.packages.find]
include = ["explore_vtla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
